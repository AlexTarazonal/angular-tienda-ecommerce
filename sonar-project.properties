# --- Identidad del proyecto ---
sonar.projectKey=tuOrg_tuProyecto
sonar.organization=tuOrg         # (solo SonarCloud)
sonar.projectName=CarritoCompra
sonar.projectVersion=1.0

# --- Qué analizar (todo tu código fuente) ---
# Angular vive en src/, y también quieres incluir server.js
sonar.sources=src,server.js

# --- Dónde están los tests y cómo ignorar lo innecesario ---
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/*.d.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/public/**

# --- TypeScript (Angular) ---
# apúntale a tus tsconfig para que resuelva paths correctamente
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.app.json,tsconfig.spec.json

# --- Cobertura (Angular CLI/Karma o Vitest/Jest) ---
# Angular CLI deja lcov en coverage/, a veces dentro de coverage/<nombre-proyecto>
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/**/lcov.info

# (opcional) si generas reporte de ESLint:
# sonar.eslint.reportPaths=eslint-report.json

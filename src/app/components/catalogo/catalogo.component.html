<div class="row">
  <div class="col-12" *ngIf="errorMsg">
    <div class="alert alert-danger">{{ errorMsg }}</div>
  </div>
  <div class="col-12" *ngIf="loading">
    <div class="text-muted">Cargando productos...</div>
  </div>

  @for (item of listaProductos; track trackById) {
    <div class="col-12 col-sm-6 col-lg-4 my-3">
      <div class="card h-100 shadow-sm">
        <div class="position-relative">
          <img
            [src]="item.imagen"
            class="card-img-top"
            [alt]="item.nombre"
            loading="lazy"
            style="object-fit: cover; height: 220px;"
          />
          <span
            class="badge bg-secondary position-absolute top-0 start-0 m-2"
            *ngIf="item.idEstadoProducto === 2"
          >
            Inactivo
          </span>
          <span
            class="badge bg-danger position-absolute top-0 start-0 m-2"
            *ngIf="item.idEstadoProducto === 3"
          >
            Agotado
          </span>
          <span
            class="badge bg-dark position-absolute bottom-0 end-0 m-2"
          >
            Stock: {{ item.stock }}
          </span>
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="fw-semibold">{{ item.nombre }}</h5>
          <p class="text-muted small flex-grow-1">{{ item.descripcion }}</p>

          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold">S/ {{ item.precio | number:'1.2-2' }}</span>
            <button
              class="btn btn-dark"
              (click)="agregarCarrito(item)"
              [disabled]="item.stock <= 0 || item.idEstadoProducto === 3"
              title="Agregar al carrito"
            >
              Agregar
            </button>
          </div>
        </div>
      </div>
    </div>
  }

  <div class="col-12" *ngIf="!loading && listaProductos.length === 0">
    <div class="alert alert-info">No hay productos para mostrar.</div>
  </div>
</div>

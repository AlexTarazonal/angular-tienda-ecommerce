          <a

          <ul class="dropdown-menu shadow border-0">

<div class="container">
  <h1 class="fw-bold text-center mb-4 text-warning">🥇 PROTEÍNAS</h1>

  <app-catalogo
    [listaProductos]="listaProductos"
    (productoEnvia)="agregarCarrito($event)"
  ></app-catalogo>

  @if (mostrarCarrito) {
  <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0, 0, 0, 0.6)">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header bg-warning text-dark">
          <h5 class="modal-title fw-bold"><i class="bi bi-cart-check me-2"></i>Carrito de Compras</h5>
          <button type="button" (click)="abrirCarrito()" class="btn-close" aria-label="Close"></button>
        </div>
        <div class="modal-body bg-light">
          <app-carrito
            [listaCarrito]="listaCarrito"
            [totalCarrito]="totalCarrito"
            (idEnvia)="eliminarItemCarrito($event)"
          ></app-carrito>
        </div>
        <div class="modal-footer bg-white">
          <button type="button" class="btn btn-outline-secondary" (click)="abrirCarrito()">
            <i class="bi bi-x-circle me-1"></i> Cerrar
          </button>
          <button type="button" class="btn btn-success" (click)="irAOrden()">
            <i class="bi bi-check-circle me-1"></i> Generar Pedido
          </button>
        </div>
      </div>
    </div>
  </div>
  }
</div>
